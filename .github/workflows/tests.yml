name: Cross-platform tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12"]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run Python unit and orchestration tests
        run: python -m unittest discover -s tests -v
      - name: Install package and run CLI smoke checks
        run: |
          python -m pip install --upgrade pip build
          python -m pip install .
          hash-audit --version
          hash-audit --help
          hash-audit formats
          hash-audit detect examples/md5.txt
          hash-audit recover examples/md5.txt --format md5 --backend hashcat --wordlist examples/words.txt --output-dir smoke-dry-run --dry-run
      - name: Verify repository public hygiene
        run: |
          python -c "import subprocess, sys; tracked = subprocess.check_output(['git', 'ls-files'], text=True).splitlines(); bad = [p for p in tracked if p.endswith(('.pot', '.restore', '.log', '.gguf')) or p.startswith('hash-audit-runs/')]; sys.exit('Forbidden tracked files: ' + ', '.join(bad) if bad else 0)"
      - name: Build release artifacts and SHA256SUMS
        run: |
          python -m build --outdir dist
          python -c "import hashlib, pathlib; d = pathlib.Path('dist'); lines = [hashlib.sha256(p.read_bytes()).hexdigest() + '  ' + p.name for p in sorted(d.iterdir()) if p.is_file() and p.name != 'SHA256SUMS.txt']; (d / 'SHA256SUMS.txt').write_text('\n'.join(lines) + '\n', encoding='utf-8'); print((d / 'SHA256SUMS.txt').read_text(encoding='utf-8'), end='')"
      - name: Upload platform build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hash-audit-${{ matrix.os }}-py${{ matrix.python-version }}
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS.txt
          if-no-files-found: error
