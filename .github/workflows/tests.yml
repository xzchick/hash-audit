name: Cross-platform tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12"]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run Python unit and orchestration tests
        run: python -m unittest discover -s tests -v
      - name: Install packaging tools and package
        run: |
          python -m pip install --upgrade pip build pyinstaller
          python -m pip install .
      - name: Build standalone native OS bundle, wheel, sdist, and SHA256SUMS
        run: python scripts/build_release_bundle.py
      - name: Run clean-machine installation and launch smoke tests
        run: python scripts/smoke_test_release.py
      - name: Upload platform release bundles and checksums
        uses: actions/upload-artifact@v4
        with:
          name: hash-audit-${{ matrix.os }}-py${{ matrix.python-version }}
          path: |
            dist/hash-audit-v*.tar.gz
            dist/hash-audit-v*.zip
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS.txt
          if-no-files-found: error
