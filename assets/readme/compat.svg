<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="578" viewBox="0 0 1000 578" role="img" aria-labelledby="title description">
  <title id="title">Compatibility by operating system</title>
  <desc id="description">Format detection and validation: macOS yes, Windows yes, Linux yes; 23 registered hash formats: macOS yes, Windows yes, Linux yes; Dictionary (wordlist) recovery: macOS yes, Windows yes, Linux yes; Hashcat masks and rule files: macOS yes, Windows yes, Linux yes; John the Ripper Jumbo recovery: macOS yes, Windows yes, Linux yes; Dry-run, time limits, clean stop: macOS yes, Windows yes, Linux yes; Private per-run results: macOS 0700/0600, Windows NTFS ACL, Linux 0700/0600; Engine install route: macOS Homebrew, Windows PATH / WSL, Linux apt · dnf; No Python dependencies: macOS yes, Windows yes, Linux yes; Standalone bundle (draft): macOS arm64, Windows x86_64, Linux x86_64; Python package (pip): macOS yes, Windows yes, Linux yes; Tested in CI on every push: macOS yes, Windows yes, Linux yes</desc>
