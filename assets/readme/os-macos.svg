<svg xmlns="http://www.w3.org/2000/svg" width="340" height="230" viewBox="0 0 340 230" role="img" aria-labelledby="title description">
  <title id="title">macOS: supported</title>
  <desc id="description">macOS: shell Terminal · zsh / bash, engines brew: hashcat, john-jumbo, results 0700 / 0600 folders, python 3.10+, or standalone</desc>
