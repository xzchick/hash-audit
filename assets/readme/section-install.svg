    <ellipse cx="920" cy="38" rx="300" ry="76" fill="url(#cloud)"/>
    <ellipse cx="90" cy="66" rx="340" ry="76" fill="url(#rose)"/>
    <g fill="#a8c7ed" opacity=".3"><circle cx="620" cy="26" r="1"/><circle cx="780" cy="52" r="1"/><circle cx="970" cy="43" r="1.2"/><circle cx="450" cy="58" r=".8"/></g>
    <defs><filter id="glow" x="-20%" y="-60%" width="140%" height="220%"><feGaussianBlur stdDeviation="5"/></filter></defs>
    <g class="flicker" filter="url(#glow)"><g transform="translate(28 23) scale(1.250)" fill="none" stroke="#ff3db4" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></g>
      <text x="74" y="48" font-size="27" font-weight="700" fill="#ff3db4" font-family="Arial, Helvetica, sans-serif">Install</text></g>
    <g transform="translate(28 23) scale(1.250)" fill="none" stroke="#ff3db4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></g>
    <text x="74" y="48" font-size="27" font-weight="700" letter-spacing=".4" fill="#f2f4ff" font-family="Arial, Helvetica, sans-serif">Install</text>
    <text x="970" y="47" font-size="12.5" letter-spacing="2.4" font-weight="600" fill="#ff3db4" text-anchor="end" font-family="Arial, Helvetica, sans-serif">PYTHON OR STANDALONE</text>
    <path d="M206 39H768" stroke="#ff3db4" stroke-opacity=".25" stroke-width="1.5"/>
    <g class="travel"><circle cx="206" cy="39" r="5" fill="#ff3db4" opacity=".3"/><circle cx="206" cy="39" r="2" fill="#fff"/></g>
