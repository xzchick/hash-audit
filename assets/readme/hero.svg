ear infinite}@keyframes ln4{0%,70.0%{opacity:0}70.1%,94%{opacity:1}97%,100%{opacity:0}}.cv4{opacity:0;animation:cv4 20s linear infinite}@keyframes cv4{0%,70.0%{opacity:1;transform:translateX(0);animation-timing-function:steps(24,end)}75.5%{opacity:1;transform:translateX(206px)}75.6%,100%{opacity:0;transform:translateX(206px)}}.rp4{animation:rp4 20s linear infinite}@keyframes rp4{0%,77.5%{opacity:0}79.0%,94%{opacity:1}97%,100%{opacity:0}}.cur{animation:blink 1.1s steps(1) infinite}@keyframes blink{50%{opacity:0}}.flick{opacity:.75;animation:flick 7s linear infinite}@keyframes flick{0%,17%,21%,63%,65%,100%{opacity:.75}19%,64%{opacity:.2}40%{opacity:.95}}.float{animation:float 8s ease-in-out infinite}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}.tw{opacity:.35;animation:tw 5s ease-in-out infinite}.tw1{animation-delay:-1.3s}.tw2{animation-delay:-2.6s}.tw3{animation-delay:-3.9s}@keyframes tw{0%,100%{opacity:.15}50%{opacity:.85}}.row{animation:row 4s linear infinite}.r1{animation-delay:-1s}.r2{animation-delay:-2s}.r3{animation-delay:-3s}@keyframes row{0%{transform:translateY(0);opacity:.1}20%{opacity:.8}100%{transform:translateY(72px);opacity:0}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style>
