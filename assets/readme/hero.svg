<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="480" viewBox="0 0 1280 480" role="img" aria-labelledby="title description">
  <title id="title">Hash Audit</title>
  <desc id="description">Local, terminal-based hash auditing and authorized password recovery for macOS, Windows and Linux. Illustrative terminal: hash-audit doctor; hash-audit detect audit.txt; hash-audit recover audit.txt --dry-run; hash-audit recover audit.txt --wordlist w.txt; hash-audit show last-run.</desc>
