<svg xmlns="http://www.w3.org/2000/svg" width="340" height="230" viewBox="0 0 340 230" role="img" aria-labelledby="title description">
  <title id="title">Linux: supported</title>
  <desc id="description">Linux: shell sh · bash · zsh, engines apt/dnf hashcat; John Jumbo, results 0700 / 0600 folders, python 3.10+, or standalone</desc>
  <defs>
    <linearGradient id="edge"><stop stop-color="#ff3db4" stop-opacity=".55"/><stop offset=".5" stop-color="#ac8cff" stop-opacity=".2"/><stop offset="1" stop-color="#35e8ff" stop-opacity=".65"/></linearGradient>
    <linearGradient id="neon"><stop stop-color="#ff3db4"/><stop offset="1" stop-color="#35e8ff"/></linearGradient>
    <radialGradient id="cloud"><stop stop-color="#0d5666" stop-opacity=".45"/><stop offset="1" stop-color="#050713" stop-opacity="0"/></radialGradient>
    <radialGradient id="rose"><stop stop-color="#a71c7d" stop-opacity=".22"/><stop offset="1" stop-color="#050713" stop-opacity="0"/></radialGradient>
    <clipPath id="clip"><rect x="1" y="1" width="338" height="228" rx="18"/></clipPath>
  </defs>
  <style>.signal{animation:pulse 7s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:.45}50%{opacity:.95}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style>
  <g clip-path="url(#clip)">
    <rect width="340" height="230" fill="#050713"/>
    <ellipse cx="260" cy="115" rx="204" ry="220" fill="url(#cloud)"/>
    <ellipse cx="90" cy="220" rx="238" ry="220" fill="url(#rose)"/>
    <g fill="#a8c7ed" opacity=".3"><circle cx="211" cy="26" r="1"/><circle cx="265" cy="206" r="1"/><circle cx="310" cy="43" r="1.2"/><circle cx="153" cy="212" r=".8"/></g>
    <circle class="signal" cx="58" cy="56" r="30" fill="#ac8cff" fill-opacity=".14"/>
    <g transform="translate(40 37) scale(1.500)"><path d="M12 2c-2.6 0-4 2.1-4 4.8 0 1.6-.6 2.8-1.5 4.2C5.3 12.8 4 14.9 4 17.2 4 20 7.3 22 12 22s8-2 8-4.8c0-2.3-1.3-4.4-2.5-6.2-.9-1.4-1.5-2.6-1.5-4.2C16 4.1 14.6 2 12 2z" fill="#ac8cff"/><path d="M12 9.5c-2.2 0-3.6 3-3.6 6.2 0 2.4 1.5 4.3 3.6 4.3s3.6-1.9 3.6-4.3c0-3.2-1.4-6.2-3.6-6.2z" fill="#050713" opacity=".85"/><circle cx="10.4" cy="6.6" r="1" fill="#050713"/><circle cx="13.6" cy="6.6" r="1" fill="#050713"/><path d="M10.6 8.4h2.8L12 10z" fill="#ff3db4"/></g>
    <text x="102" y="52" font-size="25" font-weight="700" fill="#f2f4ff" font-family="Arial, Helvetica, sans-serif">Linux</text>
    <text x="103" y="73" font-size="11.5" letter-spacing="2" font-weight="600" fill="#ac8cff" font-family="Arial, Helvetica, sans-serif">SUPPORTED</text>
    <path d="M26 88H314" stroke="#1f2547"/>
    <g font-family="Menlo, Consolas, 'Courier New', monospace" font-size="12.5"><text x="26" y="112" fill="#ac8cff">shell</text><text x="104" y="112" fill="#f2f4ff">sh · bash · zsh</text><text x="26" y="140" fill="#ac8cff">engines</text><text x="104" y="140" fill="#f2f4ff">apt/dnf hashcat; John Jumbo</text><text x="26" y="168" fill="#ac8cff">results</text><text x="104" y="168" fill="#f2f4ff">0700 / 0600 folders</text><text x="26" y="196" fill="#ac8cff">python</text><text x="104" y="196" fill="#f2f4ff">3.10+, or standalone</text></g>
  </g>
  <rect x=".75" y=".75" width="338.5" height="228.5" rx="18" fill="none" stroke="url(#edge)" stroke-width="1.5"/>
