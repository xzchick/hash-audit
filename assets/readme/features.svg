<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400" role="img" aria-labelledby="title description">
  <title id="title">What Hash Audit does</title>
  <desc id="description">23 hash formats: MD5, SHA-1/256/512, NTLM, bcrypt, crypt, MySQL, salted. (hash-audit formats); Two engines: Drives Hashcat or John Jumbo, whichever you have installed. (--backend hashcat|john); Wordlists &amp; masks: Dictionaries, Hashcat masks and rule files. (--wordlist  --mask  --rules); Safe by design: Dry-run previews, time limits, clean interruption, no shell. (--dry-run  --max-seconds); Private results: Each run isolated, 0700/0600 or a locked-down NTFS folder. (hash-audit show &lt;run&gt;); Authorized only: Offline, local files only. No accounts, no collection. (hashes you may test)</desc>
  <defs>
    <linearGradient id="edge"><stop stop-color="#ff3db4" stop-opacity=".55"/><stop offset=".5" stop-color="#ac8cff" stop-opacity=".2"/><stop offset="1" stop-color="#35e8ff" stop-opacity=".65"/></linearGradient>
    <linearGradient id="neon"><stop stop-color="#ff3db4"/><stop offset="1" stop-color="#35e8ff"/></linearGradient>
    <radialGradient id="cloud"><stop stop-color="#0d5666" stop-opacity=".45"/><stop offset="1" stop-color="#050713" stop-opacity="0"/></radialGradient>
    <radialGradient id="rose"><stop stop-color="#a71c7d" stop-opacity=".22"/><stop offset="1" stop-color="#050713" stop-opacity="0"/></radialGradient>
    <clipPath id="clip"><rect x="1" y="1" width="998" height="398" rx="20"/></clipPath>
  </defs>
  <style>.signal{animation:pulse 7s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:.45}50%{opacity:.95}}.fc0 .sh{animation:sh 9s ease-in-out 0.0s infinite}.fc1 .sh{animation:sh 9s ease-in-out -1.5s infinite}.fc2 .sh{animation:sh 9s ease-in-out -3.0s infinite}.fc3 .sh{animation:sh 9s ease-in-out -4.5s infinite}.fc4 .sh{animation:sh 9s ease-in-out -6.0s infinite}.fc5 .sh{animation:sh 9s ease-in-out -7.5s infinite}@keyframes sh{0%,100%{opacity:0}45%,55%{opacity:.9}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style>
  <g clip-path="url(#clip)">
    <rect width="1000" height="400" fill="#050713"/>
    <ellipse cx="920" cy="200" rx="300" ry="220" fill="url(#cloud)"/>
    <ellipse cx="90" cy="390" rx="340" ry="220" fill="url(#rose)"/>
    <g fill="#a8c7ed" opacity=".3"><circle cx="620" cy="26" r="1"/><circle cx="780" cy="376" r="1"/><circle cx="970" cy="43" r="1.2"/><circle cx="450" cy="382" r=".8"/></g>
    <g class="fc fc0">
      <rect x="30" y="30" width="300" height="160" rx="16" fill="#0a0e22" fill-opacity=".85" stroke="#ff3db4" stroke-opacity=".35"/>
      <circle cx="72" cy="72" r="22" fill="#ff3db4" fill-opacity=".12"/>
      <g transform="translate(60.0 60) scale(1.000)" fill="none" stroke="#ff3db4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7.5" height="7.5" rx="1.5"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="1.5"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="1.5"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="1.5"/></g>
      <text x="108" y="79" font-size="20" font-weight="700" fill="#f2f4ff" font-family="Arial, Helvetica, sans-serif">23 hash formats</text>
      <text x="54" y="122" font-size="15" fill="#b9c3df" font-family="Arial, Helvetica, sans-serif">MD5, SHA-1/256/512, NTLM,</text>
      <text x="54" y="143" font-size="15" fill="#b9c3df" font-family="Arial, Helvetica, sans-serif">bcrypt, crypt, MySQL, salted.</text>
      <text x="54" y="172" font-size="13" fill="#ff3db4" font-family="Menlo, Consolas, 'Courier New', monospace">hash-audit formats</text>
      <rect class="sh" x="30" y="30" width="300" height="3" rx="1.5" fill="#ff3db4" opacity=".0"/>
    </g>
    <g class="fc fc1">
      <rect x="350" y="30" width="300" height="160" rx="16" fill="#0a0e22" fill-opacity=".85" stroke="#35e8ff" stroke-opacity=".35"/>
      <circle cx="392" cy="72" r="22" fill="#35e8ff" fill-opacity=".12"/>
      <g transform="translate(380.0 60) scale(1.000)" fill="none" stroke="#35e8ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="6" width="12" height="12" rx="2"/><rect x="9.5" y="9.5" width="5" height="5" rx="1"/><path d="M9 2v4M15 2v4M9 18v4M15 18v4M2 9h4M2 15h4M18 9h4M18 15h4"/></g>
      <text x="428" y="79" font-size="20" font-weight="700" fill="#f2f4ff" font-family="Arial, Helvetica, sans-serif">Two engines</text>
      <text x="374" y="122" font-size="15" fill="#b9c3df" font-family="Arial, Helvetica, sans-serif">Drives Hashcat or John Jumbo,</text>
      <text x="374" y="143" font-size="15" fill="#b9c3df" font-family="Arial, Helvetica, sans-serif">whichever you have installed.</text>
      <text x="374" y="172" font-size="13" fill="#35e8ff" font-family="Menlo, Consolas, 'Courier New', monospace">--backend hashcat|john</text>
      <rect class="sh" x="350" y="30" width="300" height="3" rx="1.5" fill="#35e8ff" opacity=".0"/>
    </g>
    <g class="fc fc2">
      <rect x="670" y="30" width="300" height="160" rx="16" fill="#0a0e22" fill-opacity=".85" stroke="#ac8cff" stroke-opacity=".35"/>
      <circle cx="712" cy="72" r="22" fill="#ac8cff" fill-opacity=".12"/>
      <g transform="translate(700.0 60) scale(1.000)" fill="none" stroke="#ac8cff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></g>
      <text x="748" y="79" font-size="20" font-weight="700" fill="#f2f4ff" font-family="Arial, Helvetica, sans-serif">Wordlists &amp; masks</text>
      <text x="694" y="122" font-size="15" fill="#b9c3df" font-family="Arial, Helvetica, sans-serif">Dictionaries, Hashcat masks</text>
      <text x="694" y="143" font-size="15" fill="#b9c3df" font-family="Arial, Helvetica, sans-serif">and rule files.</text>
      <text x="694" y="172" font-size="13" fill="#ac8cff" font-family="Menlo, Consolas, 'Courier New', monospace">--wordlist  --mask  --rules</text>
      <rect class="sh" x="670" y="30" width="300" height="3" rx="1.5" fill="#ac8cff" opacity=".0"/>
    </g>
    <g class="fc fc3">
      <rect x="30" y="220" width="300" height="160" rx="16" fill="#0a0e22" fill-opacity=".85" stroke="#ff3db4" stroke-opacity=".35"/>
      <circle cx="72" cy="262" r="22" fill="#ff3db4" fill-opacity=".12"/>
      <g transform="translate(60.0 250) scale(1.000)" fill="none" stroke="#ff3db4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/></g>
      <text x="108" y="269" font-size="20" font-weight="700" fill="#f2f4ff" font-family="Arial, Helvetica, sans-serif">Safe by design</text>
      <text x="54" y="312" font-size="15" fill="#b9c3df" font-family="Arial, Helvetica, sans-serif">Dry-run previews, time limits,</text>
      <text x="54" y="333" font-size="15" fill="#b9c3df" font-family="Arial, Helvetica, sans-serif">clean interruption, no shell.</text>
      <text x="54" y="362" font-size="13" fill="#ff3db4" font-family="Menlo, Consolas, 'Courier New', monospace">--dry-run  --max-seconds</text>
      <rect class="sh" x="30" y="220" width="300" height="3" rx="1.5" fill="#ff3db4" opacity=".0"/>
    </g>
    <g class="fc fc4">
      <rect x="350" y="220" width="300" height="160" rx="16" fill="#0a0e22" fill-opacity=".85" stroke="#35e8ff" stroke-opacity=".35"/>
      <circle cx="392" cy="262" r="22" fill="#35e8ff" fill-opacity=".12"/>
      <g transform="translate(380.0 250) scale(1.000)" fill="none" stroke="#35e8ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></g>
      <text x="428" y="269" font-size="20" font-weight="700" fill="#f2f4ff" font-family="Arial, Helvetica, sans-serif">Private results</text>
      <text x="374" y="312" font-size="15" fill="#b9c3df" font-family="Arial, Helvetica, sans-serif">Each run isolated, 0700/0600</text>
      <text x="374" y="333" font-size="15" fill="#b9c3df" font-family="Arial, Helvetica, sans-serif">or a locked-down NTFS folder.</text>
      <text x="374" y="362" font-size="13" fill="#35e8ff" font-family="Menlo, Consolas, 'Courier New', monospace">hash-audit show &lt;run&gt;</text>
      <rect class="sh" x="350" y="220" width="300" height="3" rx="1.5" fill="#35e8ff" opacity=".0"/>
    </g>
    <g class="fc fc5">
      <rect x="670" y="220" width="300" height="160" rx="16" fill="#0a0e22" fill-opacity=".85" stroke="#ac8cff" stroke-opacity=".35"/>
      <circle cx="712" cy="262" r="22" fill="#ac8cff" fill-opacity=".12"/>
      <g transform="translate(700.0 250) scale(1.000)" fill="none" stroke="#ac8cff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18M7 21h10M5 7h14"/><path d="M5 7l-3 7a3 3 0 0 0 6 0zM19 7l-3 7a3 3 0 0 0 6 0z"/></g>
      <text x="748" y="269" font-size="20" font-weight="700" fill="#f2f4ff" font-family="Arial, Helvetica, sans-serif">Authorized only</text>
      <text x="694" y="312" font-size="15" fill="#b9c3df" font-family="Arial, Helvetica, sans-serif">Offline, local files only.</text>
      <text x="694" y="333" font-size="15" fill="#b9c3df" font-family="Arial, Helvetica, sans-serif">No accounts, no collection.</text>
      <text x="694" y="362" font-size="13" fill="#ac8cff" font-family="Menlo, Consolas, 'Courier New', monospace">hashes you may test</text>
      <rect class="sh" x="670" y="220" width="300" height="3" rx="1.5" fill="#ac8cff" opacity=".0"/>
    </g>
  </g>
  <rect x=".75" y=".75" width="998.5" height="398.5" rx="20" fill="none" stroke="url(#edge)" stroke-width="1.5"/>
</svg>
